<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account · Blue Code OS</title><link rel="stylesheet" href="/static/styles.css"></head>
<body data-page="register">
<header class="top"><a class="brand" href="/">Blue Code OS</a><nav id="nav" aria-label="Main"></nav></header>
<main class="card">
<h1>Create your account</h1><form id="register-form" novalidate><label>Full name<input name="name" autocomplete="name" data-testid="reg-name" required></label><label>Email<input name="email" type="email" autocomplete="email" data-testid="reg-email" required></label><label>Password<input name="password" type="password" autocomplete="new-password" data-testid="reg-password" required></label><p class="hint">At least 10 characters with letters and numbers.</p><p id="form-error" class="error" role="alert" data-testid="form-error"></p><button type="submit" data-testid="reg-submit">Create account</button></form>
</main>
<script src="/static/app.js" defer></script>
</body>
</html>
