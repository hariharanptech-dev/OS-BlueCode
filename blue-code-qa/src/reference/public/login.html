<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Blue Code OS</title><link rel="stylesheet" href="/static/styles.css"></head>
<body data-page="login">
<header class="top"><a class="brand" href="/">Blue Code OS</a><nav id="nav" aria-label="Main"></nav></header>
<main class="card">
<h1>Sign in</h1><p id="notice" class="ok" data-testid="login-notice"></p><form id="login-form" novalidate><label>Email<input name="email" type="email" autocomplete="username" data-testid="login-email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" data-testid="login-password" required></label><p id="form-error" class="error" role="alert" data-testid="form-error"></p><button type="submit" data-testid="login-submit">Sign in</button></form>
</main>
<script src="/static/app.js" defer></script>
</body>
</html>
